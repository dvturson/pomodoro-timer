<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title id="title">Pomodoro Timer</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="sky"></div>
        <div id="content">
            <h1 id="status"></h1>
            <h1 id="timer"></h1>
            <div id="settings">
                <select name="study_options" id="study_options">
                    <option value="35">35</option>
                    <option value="20">20</option>
                </select>
                <select name="sBreak_options" id="sBreak_options">
                    <option value="5">5</option>
                    <option value="7">7</option>
                </select>
                <select name="lBreak_options" id="lBreak_options">
                    <option value="15">15</option>
                    <option value="20">20</option>
                </select>
                
            </div>
            <button id="startPauseBtn" type="button">start</button>
            <button id="resetBtn" type="button">reset</button>
        </div>

        <audio id="alarmSound" src="alarm.mp3" preload="auto"></audio>
        <script src="script.js"></script>
        <!-- <script src="cloud_script.js"></script> -->
    </body>
</html>
